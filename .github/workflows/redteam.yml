name: redteam
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests (no network, no secrets)
        run: python -m unittest discover -s tests -v
      - name: Pipeline smoke test on the simulator
        run: python -m redteam run --targets mock:vulnerable --defenses none layered --trials 2 --workers 1 --out results --fail-above 0.25 --gate-defense layered
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard
          path: results/
