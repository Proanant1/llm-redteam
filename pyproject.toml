[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-redteam"
version = "0.1.0"
description = "Dependency-free red-team and evaluation harness for LLM applications"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
llm-redteam = "redteam.cli:main"

[tool.setuptools]
packages = ["redteam"]
